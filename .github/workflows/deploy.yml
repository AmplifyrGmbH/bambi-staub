name: Deploy to Hostpoint

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Zugangsdaten Admin-Center schreiben (aus Secret, nicht im Repo)
        env:
          BAMBI_ADMIN_CONFIG: ${{ secrets.BAMBI_ADMIN_CONFIG }}
        run: |
          if [ -n "$BAMBI_ADMIN_CONFIG" ]; then echo "$BAMBI_ADMIN_CONFIG" | base64 -d > config/admin.php; fi

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.DS_Store
            **/Infos.rtf
            **/site/**
            docs/**
